<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cases Calendar</title>
<script src="static/fullcalendar-6.1.15.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2457c5; --manual:#b45309; --bad:#b91c1c; --ok:#15803d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  #status { color:var(--muted); font-size:13px; }
  main { padding:16px; max-width:1300px; margin:0 auto; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  button, select, input, textarea { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs button.active { background:var(--text); color:#fff; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .wrap { overflow-x:auto; }
  .manual { color:var(--manual); font-weight:600; } .muted { color:var(--muted); font-size:12px; }
  .group td { background:#eef2fb; font-weight:600; }
  .fc-event { cursor:pointer; } .fc-event.is-manual { background:var(--manual); border-color:var(--manual); }
  dialog { border:1px solid var(--line); border-radius:10px; width:min(520px, 94vw); padding:18px; }
  dialog label { display:block; margin:10px 0 4px; font-weight:600; } dialog input, dialog textarea { width:100%; }
  .hist { max-height:180px; overflow:auto; font-size:12px; margin-top:12px; }
  .ok { color:var(--ok); } .failed { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>My Cases Calendar</h1>
  <div id="status">Loading…</div>
  <div class="bar" style="margin:0"><button class="primary" id="syncBtn">Sync now</button><a href="calendar.ics"><button>Download .ics</button></a></div>
</header>
<main>
  <div class="card">
    <div class="bar">
      <span class="tabs"><button data-view="calendar" class="active">Calendar</button><button data-view="list">List</button></span>
      <label>Group by <select id="groupBy"><option value="date">Date</option><option value="district">District</option><option value="court">Court</option></select></label>
      <select id="fDistrict"><option value="">All districts</option></select>
      <select id="fCourt"><option value="">All courts</option></select>
      <input id="search" placeholder="Search case / party / CNR">
      <label><input type="checkbox" id="showClosed"> include closed</label>
    </div>
    <div id="calendarView"><div id="calendar"></div></div>
    <div id="listView" hidden class="wrap"><table><thead><tr><th>Next date</th><th>Case</th><th>Parties</th><th>District / Court</th><th>Stage</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3 id="dlgTitle" style="margin:0 0 4px"></h3>
    <div class="muted" id="dlgInfo"></div>
    <label for="dlgDate">Next date</label>
    <input type="date" id="dlgDate" required>
    <div class="muted" id="dlgPortal"></div>
    <label for="dlgNote">Note (optional)</label>
    <textarea id="dlgNote" rows="2"></textarea>
    <div class="bar" style="margin-top:14px">
      <button class="primary" value="save">Save my date</button>
      <button value="clear" id="clearBtn">Use portal date</button>
      <button value="cancel" formnovalidate>Cancel</button>
    </div>
    <div class="hist" id="dlgHist"></div>
  </form>
</dialog>

<script>
let cases = [], calendar, view = "calendar", editing = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (d) => d ? new Date(d + "T00:00").toLocaleDateString("en-IN", {day:"2-digit", month:"short", year:"numeric", weekday:"short"}) : "No date";

async function load() {
  cases = await (await fetch("api/cases" + ($("showClosed").checked ? "?all=1" : ""))).json();
  fillSelect($("fDistrict"), "district", "All districts");
  fillSelect($("fCourt"), "court", "All courts");
  render();
  loadStatus();
}
function fillSelect(sel, key, label) {
  const cur = sel.value, vals = [...new Set(cases.map((c) => c[key]).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">${label}</option>` + vals.map((v) => `<option>${esc(v)}</option>`).join("");
  sel.value = vals.includes(cur) ? cur : "";
}
function filtered() {
  const q = $("search").value.toLowerCase(), d = $("fDistrict").value, ct = $("fCourt").value;
  return cases.filter((c) => (!d || c.district === d) && (!ct || c.court === ct) &&
    (!q || [c.case_no, c.cnr, c.parties, c.court].join(" ").toLowerCase().includes(q)));
}
function render() {
  const list = filtered();
  calendar.removeAllEvents();
  list.filter((c) => c.effective_date).forEach((c) => calendar.addEvent({
    id: String(c.id), title: (c.case_no || c.cnr || "") + " " + (c.parties || ""), start: c.effective_date, allDay: true,
    classNames: c.manual_date ? ["is-manual"] : [], extendedProps: c,
  }));
  const key = $("groupBy").value === "date" ? "effective_date" : $("groupBy").value;
  const sorted = [...list].sort((a, b) => (a[key] || "~").localeCompare(b[key] || "~") || (a.effective_date || "~").localeCompare(b.effective_date || "~"));
  let last = null, html = "";
  for (const c of sorted) {
    const g = key === "effective_date" ? fmt(c[key]) : (c[key] || "Unknown");
    if (g !== last) { html += `<tr class="group"><td colspan="6">${esc(g)}</td></tr>`; last = g; }
    html += `<tr><td>${c.manual_date ? `<span class="manual" title="Set by you">${fmt(c.manual_date)} ✎</span><div class="muted">portal: ${fmt(c.scraped_date)}</div>` : fmt(c.scraped_date)}</td>
      <td>${esc(c.case_no)}<div class="muted">${esc(c.cnr)}</div></td><td>${esc(c.parties)}</td>
      <td>${esc(c.district)}<div class="muted">${esc(c.court)}${c.establishment ? " · " + esc(c.establishment) : ""}</div></td>
      <td>${esc(c.stage)}${c.active ? "" : ' <span class="muted">(closed)</span>'}</td>
      <td><button data-edit="${c.id}">Change date</button></td></tr>`;
  }
  $("rows").innerHTML = html || '<tr><td colspan="6" class="muted">No cases yet — click "Sync now".</td></tr>';
}
async function openEdit(id) {
  const c = cases.find((x) => x.id === id); editing = c;
  $("dlgTitle").textContent = c.case_no || c.cnr;
  $("dlgInfo").textContent = [c.parties, c.court, c.district].filter(Boolean).join(" · ");
  $("dlgDate").value = c.effective_date || "";
  $("dlgNote").value = c.manual_note || "";
  $("dlgPortal").textContent = "Portal date: " + fmt(c.scraped_date);
  $("clearBtn").hidden = !c.manual_date;
  const hist = await (await fetch(`api/cases/${id}/history`)).json();
  $("dlgHist").innerHTML = "<b>History</b>" + hist.map((h) => `<div>${esc(h.changed_at.replace("T", " "))} — ${esc(h.source)}: ${fmt(h.old_date)} → ${fmt(h.new_date)} ${h.note ? "(" + esc(h.note) + ")" : ""}</div>`).join("");
  $("editDlg").showModal();
}
$("editDlg").addEventListener("close", async () => {
  const action = $("editDlg").returnValue;
  if (!editing || !["save", "clear"].includes(action)) return;
  const body = action === "save" ? {date: $("dlgDate").value, note: $("dlgNote").value} : {date: null};
  await fetch(`api/cases/${editing.id}/date`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  load();
});
async function loadStatus() {
  const s = await (await fetch("api/status")).json(), r = s.runs[0];
  const last = r ? `Last sync ${r.started_at.replace("T", " ")}: <span class="${r.status}">${r.status}</span>${r.message ? " — " + esc(r.message) : ""}` : "Never synced";
  $("status").innerHTML = last + (s.next_run ? ` · Next: ${esc(s.next_run.slice(0, 16).replace("T", " "))}` : "");
  if (r && r.status === "running") setTimeout(load, 5000);
}
$("syncBtn").onclick = async () => { await fetch("api/sync", {method: "POST"}); $("status").textContent = "Sync started…"; setTimeout(load, 3000); };
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  view = b.dataset.view; document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
  $("calendarView").hidden = view !== "calendar"; $("listView").hidden = view !== "list"; if (view === "calendar") calendar.updateSize();
});
["groupBy", "fDistrict", "fCourt"].forEach((id) => $(id).onchange = render);
$("search").oninput = render; $("showClosed").onchange = load;
$("rows").onclick = (e) => { const id = e.target.dataset.edit; if (id) openEdit(+id); };

calendar = new FullCalendar.Calendar($("calendar"), {
  initialView: window.innerWidth < 700 ? "listMonth" : "dayGridMonth",
  headerToolbar: {left: "prev,next today", center: "title", right: "dayGridMonth,listMonth"},
  height: "auto", dayMaxEvents: 4, editable: true,
  eventClick: (info) => openEdit(+info.event.id),
  eventDrop: async (info) => {  // drag a case to another day = manual date change
    await fetch(`api/cases/${info.event.id}/date`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({date: info.event.startStr, note: "moved on calendar"})});
    load();
  },
});
calendar.render();
load();
</script>
</body>
</html>
